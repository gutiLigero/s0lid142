  <style>
    :root {
      --bg-black: #0F110E;
      --surface-dark: #151814;
      --text-main: #DDE1DB;
      --text-muted: #B6BFB1;
      --brand-blue: #4279CD;
      --brand-green: #408C48;
      --accent-neon: #53FA00;
      --border-subtle: rgba(182, 191, 177, 0.18);
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 40px 20px;
      -webkit-font-smoothing: antialiased;
    }

    .gallery-container {
      width: 100%;
      max-width: 520px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    /* Galería / Marco de Imagen */
    .artwork-frame {
      width: 100%;
      height: 280px;
      background-color: var(--surface-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 4px;
      position: relative;
      overflow: hidden;
      margin-bottom: 24px;
      display: flex;
      justify-content: center;
      align-items: center;
      transition: border-color 0.3s ease;
    }

    .artwork-frame:hover {
      border-color: var(--accent-neon);
    }

    .artwork-frame img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      display: block;
      filter: grayscale(15%) contrast(105%);
      transition: transform 0.5s ease;
    }

    .artwork-frame:hover img {
      transform: scale(1.02);
    }

    /* Placeholder mientras subes la foto */
    .image-placeholder {
      color: var(--text-muted);
      font-size: 0.75rem;
      letter-spacing: 2px;
      text-transform: uppercase;
      text-align: center;
      padding: 20px;
      border: 1px dashed var(--border-subtle);
    }

    /* Cabecera Editorial */
    header {
      text-align: center;
      margin-bottom: 32px;
      width: 100%;
    }

    .catalog-tag {
      font-size: 0.7rem;
      letter-spacing: 3px;
      text-transform: uppercase;
      color: var(--accent-neon);
      margin-bottom: 8px;
      display: block;
      font-weight: 600;
    }

    h1 {
      font-size: 2.2rem;
      font-weight: 300;
      letter-spacing: -0.5px;
      color: var(--text-main);
      margin-bottom: 6px;
    }

    p.sub-title {
      color: var(--text-muted);
      font-size: 0.88rem;
      letter-spacing: 1px;
      font-weight: 400;
    }

    /* Enlaces / Catálogo */
    .catalog-list {
      width: 100%;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .catalog-item {
      display: flex;
      justify-content: space-between;
      align-items: center;
      background: var(--surface-dark);
      color: var(--text-main);
      text-decoration: none;
      padding: 18px 22px;
      border-radius: 4px;
      border: 1px solid var(--border-subtle);
      transition: all 0.25s cubic-bezier(0.16, 1, 0.3, 1);
      position: relative;
    }

    .catalog-item .item-info {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .catalog-item .index {
      font-size: 0.75rem;
      color: var(--brand-green);
      font-weight: 600;
      letter-spacing: 1px;
    }

    .catalog-item .title {
      font-size: 0.95rem;
      letter-spacing: 0.5px;
      font-weight: 500;
    }

    .catalog-item .arrow {
      font-size: 0.9rem;
      color: var(--text-muted);
      transition: transform 0.25s ease, color 0.25s ease;
    }

    /* Hover State Estilo Galería */
    .catalog-item:hover {
      background: #1c211a;
      border-color: var(--accent-neon);
      transform: translateY(-2px);
      box-shadow: 0 4px 20px rgba(83, 250, 0, 0.08);
    }

    .catalog-item:hover .arrow {
      color: var(--accent-neon);
      transform: translateX(4px);
    }

    .catalog-item:hover .index {
      color: var(--accent-neon);
    }

    /* Botón destacado del Sintetizador */
    .catalog-item.synth-highlight {
      border-color: rgba(66, 121, 205, 0.4);
    }

    .catalog-item.synth-highlight .index {
      color: var(--brand-blue);
    }

    .catalog-item.synth-highlight:hover {
      border-color: var(--accent-neon);
    }

    /* Footer */
    footer {
      margin-top: 48px;
      text-align: center;
      border-top: 1px solid var(--border-subtle);
      width: 100%;
      padding-top: 20px;
    }

    footer p {
      font-size: 0.72rem;
      letter-spacing: 2px;
      color: var(--text-muted);
      text-transform: uppercase;
    }
  </style>

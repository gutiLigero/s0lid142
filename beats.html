<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>s0lid142 — Drum Machine & MIDI</title>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/tone/14.8.49/Tone.js"></script>
  <style>
    :root {
      --bg-black: #0F110E;
      --surface-dark: #151814;
      --text-main: #DDE1DB;
      --text-muted: #B6BFB1;
      --brand-blue: #4279CD;
      --brand-green: #408C48;
      --accent-neon: #53FA00;
      --accent-alert: #ff4b4b;
      --border-subtle: rgba(182, 191, 177, 0.18);
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background-color: var(--bg-black);
      color: var(--text-main);
      font-family: -apple-system, BlinkMacSystemFont, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 40px 20px;
      min-height: 100vh;
      -webkit-font-smoothing: antialiased;
    }

    .machine-container {
      width: 100%;
      max-width: 480px;
      background: var(--surface-dark);
      border: 1px solid var(--border-subtle);
      border-radius: 8px;
      padding: 30px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.5);
    }

    header {
      margin-bottom: 24px;
      border-bottom: 1px solid var(--border-subtle);
      padding-bottom: 16px;
    }

    .header-top {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 12px;
    }

    h2 { font-weight: 400; letter-spacing: -0.5px; }
    
    .midi-status {
      font-size: 0.75rem;
      letter-spacing: 1px;
      text-transform: uppercase;
      display: flex;
      align-items: center;
      gap: 6px;
      color: var(--text-muted);
    }

    .midi-led {
      width: 8px;
      height: 8px;
      border-radius: 50%;
      background-color: var(--accent-alert); 
      box-shadow: 0 0 5px var(--accent-alert);
    }

    .midi-led.active {
      background-color: var(--accent-neon);
      box-shadow: 0 0 8px var(--accent-neon);
    }

    .header-bottom {
      display: flex;
      justify-content: space-between;
      align-items: center;
    }

    /* Botón de Mapeo */
    .learn-btn {
      background: transparent;
      color: var(--text-muted);
      border: 1px solid var(--text-muted);
      padding: 6px 12px;
      border-radius: 4px;
      font-size: 0.75rem;
      cursor: pointer;
      text-transform: uppercase;
      letter-spacing: 1px;
      transition: all 0.2s ease;
    }

    .learn-btn.active {
      background: rgba(83, 250, 0, 0.1);
      color: var(--accent-neon);
      border-color: var(--accent-neon);
      box-shadow: 0 0 10px rgba(83, 250, 0, 0.2);
    }

    #midi-debug {
      font-size: 0.7rem;
      color: var(--brand-blue);
      text-align: right;
      max-width: 60%;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    /* Grid de Pads (4x2) */
    .pad-grid {
      display: grid;
      grid-template-columns: repeat(4, 1fr);
      gap: 12px;
    }

    .pad {
      aspect-ratio: 1 / 1;
      background: #1c211a;
      border: 1px solid var(--border-subtle);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      flex-direction: column;
      justify-content: flex-end;
      padding: 8px;
      font-size: 0.7rem;
      color: var(--text-muted);
      text-transform: uppercase;
      font-weight: 600;
      transition: all 0.05s ease;
      user-select: none;
      position: relative;
    }

    .pad .midi-hint {
      position: absolute;
      top: 6px;
      right: 6px;
      font-size: 0.6rem;
      color: var(--brand-blue);
      font-family: monospace;
      opacity: 0.7;
    }

    .pad:active, .pad.triggered {
      background: var(--brand-blue);
      border-color: var(--text-main);
      color: white;
      transform: scale(0.96);
      box-shadow: 0 0 15px rgba(66, 121, 205, 0.5);
    }

    .pad.binding {
      background: rgba(255, 75, 75, 0.1);
      border-color: var(--accent-alert);
      color: white;
      animation: pulse 1s infinite alternate;
    }

    @keyframes pulse {
      from { box-shadow: 0 0 5px var(--accent-alert); }
      to { box-shadow: 0 0 15px var(--accent-alert); }
    }

    .back-btn {
      display: inline-block;
      margin-top: 30px;
      color: var(--text-muted);
      text-decoration: none;
      font-size: 0.85rem;
      text-transform: uppercase;
      letter-spacing: 2px;
      transition: color 0.2s;
    }

    .back-btn:hover { color: var(--accent-neon); }
  </style>
</head>
<body>

  <div class="machine-container">
    <header>
      <div class="header-top">
        <h2>WebMPC // MIDI</h2>
        <div class="midi-status">
          <div class="midi-led" id="midi-led"></div>
          <span id="midi-text">MIDI OFF</span>
        </div>
      </div>
      <div class="header-bottom">
        <button id="learn-btn" class="learn-btn">🔗 Mapear Pads</button>
        <span id="midi-debug">Listo.</span>
      </div>
    </header>

    <div class="pad-grid" id="pads-container">
      <div class="pad" data-midi="36" data-sound="kick" id="pad-kick">
        <span class="midi-hint">[36]</span>Kick
      </div>
      <div class="pad" data-midi="38" data-sound="snare" id="pad-snare">
        <span class="midi-hint">[38]</span>Snare
      </div>
      <div class="pad" data-midi="42" data-sound="hihatC" id="pad-hihatC">
        <span class="midi-hint">[42]</span>Hat C.
      </div>
      <div class="pad" data-midi="46" data-sound="hihatO" id="pad-hihatO">
        <span class="midi-hint">[46]</span>Hat O.
      </div>
      <div class="pad" data-midi="45" data-sound="tomL" id="pad-tomL">
        <span class="midi-hint">[45]</span>Tom L
      </div>
      <div class="pad" data-midi="50" data-sound="tomH" id="pad-tomH">
        <span class="midi-hint">[50]</span>Tom H
      </div>
      <div class="pad" data-midi="39" data-sound="clap" id="pad-clap">
        <span class="midi-hint">[39]</span>Clap
      </div>
      <div class="pad" data-midi="49" data-sound="crash" id="pad-crash">
        <span class="midi-hint">[49]</span>Crash
      </div>
    </div>
  </div>
  
  <a href="index.html" class="back-btn">← Volver al catálogo</a>

  <script>
    // --- 1. MOTOR DE AUDIO (Tone.js) ---
    const synths = {
      kick: new Tone.MembraneSynth().toDestination(),
      snare: new Tone.NoiseSynth({ noise: { type: 'white' }, envelope: { attack: 0.005, decay: 0.2, sustain: 0 } }).toDestination(),
      hihatC: new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 0.1, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5 }).toDestination(),
      hihatO: new Tone.MetalSynth({ frequency: 200, envelope: { attack: 0.001, decay: 0.4, release: 0.01 }, harmonicity: 5.1, modulationIndex: 32, resonance: 4000, octaves: 1.5 }).toDestination(),
      tomL: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 2, envelope: { attack: 0.01, decay: 0.4, sustain: 0 } }).toDestination(),
      tomH: new Tone.MembraneSynth({ pitchDecay: 0.05, octaves: 4, envelope: { attack: 0.01, decay: 0.4, sustain: 0 } }).toDestination(),
      clap: new Tone.NoiseSynth({ noise: { type: 'pink' }, envelope: { attack: 0.005, decay: 0.1, sustain: 0 } }).toDestination(),
      crash: new Tone.MetalSynth({ frequency: 300, envelope: { attack: 0.001, decay: 1.5, release: 0.2 }, harmonicity: 4, modulationIndex: 40, resonance: 2000 }).toDestination()
    };

    async function playSound(padElement) {
      await Tone.start();
      const soundType = padElement.getAttribute('data-sound');
      if (soundType === 'kick' || soundType === 'tomL' || soundType === 'tomH') {
        synths[soundType].triggerAttackRelease(soundType === 'kick' ? "C1" : soundType === 'tomL' ? "G1" : "C2", "8n");
      } else {
        synths[soundType].triggerAttackRelease("16n");
      }
      padElement.classList.add('triggered');
      setTimeout(() => padElement.classList.remove('triggered'), 100);
    }

    // --- 2. LÓGICA DE MAPEO (MIDI LEARN) Y MEMORIA ---
    let learnMode = false;
    let padToBind = null;

    function loadSavedMidiMap() {
      const savedMap = JSON.parse(localStorage.getItem('s0lid142_midi_map'));
      if (savedMap) {
        document.querySelectorAll('.pad').forEach(pad => {
          const sound = pad.getAttribute('data-sound');
          if (savedMap[sound]) {
            pad.setAttribute('data-midi', savedMap[sound]);
            pad.querySelector('.midi-hint').innerText = `[${savedMap[sound]}]`;
          }
        });
      }
    }
    loadSavedMidiMap();

    const learnBtn = document.getElementById('learn-btn');
    learnBtn.addEventListener('click', () => {
      learnMode = !learnMode;
      learnBtn.classList.toggle('active', learnMode);
      
      if (learnMode) {
        learnBtn.innerText = "Selecciona un pad web 👇";
      } else {
        learnBtn.innerText = "🔗 Mapear Pads";
        if (padToBind) padToBind.classList.remove('binding');
        padToBind = null;
      }
    });

    document.querySelectorAll('.pad').forEach(pad => {
      pad.addEventListener('mousedown', () => {
        if (learnMode) {
          document.querySelectorAll('.pad').forEach(p => p.classList.remove('binding'));
          padToBind = pad;
          pad.classList.add('binding');
          learnBtn.innerText = "Toca tu controlador 🎹";
        } else {
          playSound(pad);
        }
      });
    });

    function saveMidiMap() {
      const currentMap = {};
      document.querySelectorAll('.pad').forEach(pad => {
        currentMap[pad.getAttribute('data-sound')] = pad.getAttribute('data-midi');
      });
      localStorage.setItem('s0lid142_midi_map', JSON.stringify(currentMap));
    }

    // --- 3. MOTOR WebMIDI MEJORADO ---
    if (navigator.requestMIDIAccess) {
      navigator.requestMIDIAccess().then(onMIDISuccess, onMIDIFailure);
    }

    function updateMidiStatus(midiAccess) {
      let activeDevices = [];
      
      // Recolectar nombres de dispositivos realmente conectados
      for (let input of midiAccess.inputs.values()) {
        if (input.state === "connected") {
          activeDevices.push(input.name);
          input.onmidimessage = getMIDIMessage; 
        }
      }

      const led = document.getElementById('midi-led');
      const text = document.getElementById('midi-text');
      const debug = document.getElementById('midi-debug');

      if (activeDevices.length > 0) {
        led.classList.add('active');
        text.innerText = "MIDI ON";
        
        // Mostrar qué dispositivo específico se reconoció
        if (!debug.innerText.includes("Cmd:")) {
          debug.innerText = `🔌 ${activeDevices[0]}`;
        }
      } else {
        led.classList.remove('active');
        text.innerText = "MIDI OFF";
        debug.innerText = "Desconectado.";
      }
    }

    function onMIDISuccess(midiAccess) {
      updateMidiStatus(midiAccess);
      
      // Manejar explícitamente eventos de conexión y desconexión
      midiAccess.onstatechange = (e) => {
        updateMidiStatus(midiAccess);
        
        // Mensaje extra si el cable se desconecta
        if (e.port.state === "disconnected" && e.port.type === "input") {
           document.getElementById('midi-debug').innerText = "❌ Desconectado";
        }
      };
    }

    function onMIDIFailure() {
      document.getElementById('midi-debug').innerText = "Error acceso MIDI.";
    }

    function getMIDIMessage(message) {
      const command = message.data[0];
      const note = message.data[1];
      const velocity = (message.data.length > 2) ? message.data[2] : 0;

      // Monitor constante en pantalla
      document.getElementById('midi-debug').innerText = `Cmd: ${command} | Nota: ${note}`;

      const isNoteOn = (command >= 144 && command <= 159);

      if (isNoteOn && velocity > 0) {
        if (learnMode && padToBind) {
          padToBind.setAttribute('data-midi', note);
          padToBind.querySelector('.midi-hint').innerText = `[${note}]`;
          padToBind.classList.remove('binding');
          padToBind = null;
          learnBtn.innerText = "Asignado ✅ Selecciona otro";
          saveMidiMap();
        } else {
          const padToTrigger = document.querySelector(`.pad[data-midi="${note}"]`);
          if (padToTrigger) {
            playSound(padToTrigger);
          }
        }
      }
    }
  </script>
</body>
</html>
